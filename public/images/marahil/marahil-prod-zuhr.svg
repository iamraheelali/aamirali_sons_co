<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="title desc">
  <title id="title">MARAHIL Zuhr fragrance bottle</title>
  <desc id="desc">Faceted clear glass fragrance bottle with a matte black cap and brass Zuhr plaque.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#263128"/>
      <stop offset=".58" stop-color="#111813"/>
      <stop offset="1" stop-color="#050706"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".1"/>
      <stop offset=".18" stop-color="#F2EFE8" stop-opacity=".58"/>
      <stop offset=".34" stop-color="#FFFFFF" stop-opacity=".08"/>
      <stop offset=".68" stop-color="#AEB5AA" stop-opacity=".2"/>
      <stop offset=".88" stop-color="#FFFFFF" stop-opacity=".62"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="juice" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5C3712" stop-opacity=".72"/>
      <stop offset=".45" stop-color="#B27428" stop-opacity=".9"/>
      <stop offset=".7" stop-color="#7A4918" stop-opacity=".82"/>
      <stop offset="1" stop-color="#3A230F" stop-opacity=".72"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#30352F"/>
      <stop offset=".5" stop-color="#090B09"/>
      <stop offset="1" stop-color="#1B1D1B"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E0C88D"/>
      <stop offset=".45" stop-color="#A8894D"/>
      <stop offset="1" stop-color="#6A5026"/>
    </linearGradient>
    <filter id="shadow" x="-.3" y="-.3" width="1.6" height="1.7"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <ellipse cx="400" cy="912" rx="274" ry="40" fill="#000" opacity=".72" filter="url(#shadow)"/>
  <rect x="262" y="86" width="276" height="220" rx="30" fill="url(#cap)" stroke="#A8894D" stroke-width="3"/>
  <ellipse cx="400" cy="86" rx="138" ry="36" fill="#080A08" stroke="#A8894D" stroke-width="3"/>
  <ellipse cx="400" cy="86" rx="108" ry="26" fill="none" stroke="#A8894D" stroke-width="2"/>
  <text x="400" y="95" text-anchor="middle" fill="#D0B477" font-family="Georgia, serif" font-size="25" letter-spacing="6">MARAHIL</text>
  <rect x="314" y="300" width="172" height="40" fill="#8D6B35"/>
  <path d="M184 340 L616 340 L682 430 L682 850 Q682 930 600 930 L200 930 Q118 930 118 850 L118 430 Z" fill="url(#glass)" stroke="#F2EFE8" stroke-opacity=".72" stroke-width="9"/>
  <path d="M170 444 L224 366 L224 874 L166 898 Z M630 444 L576 366 L576 874 L634 898 Z" fill="#FFFFFF" fill-opacity=".1" stroke="#F2EFE8" stroke-opacity=".48" stroke-width="5"/>
  <path d="M226 370 L574 370 L632 438 L574 882 L226 882 L168 438 Z" fill="url(#juice)" stroke="#FFFFFF" stroke-opacity=".24" stroke-width="5"/>
  <path d="M248 394 L552 394 L594 448 L552 846 L248 846 L206 448 Z" fill="#D89A42" fill-opacity=".16"/>
  <rect x="254" y="540" width="292" height="142" rx="5" fill="url(#brass)" stroke="#F2EFE8" stroke-opacity=".7" stroke-width="5"/>
  <rect x="266" y="552" width="268" height="118" rx="3" fill="none" stroke="#5F451F" stroke-opacity=".7" stroke-width="2"/>
  <text x="400" y="630" text-anchor="middle" fill="#161816" font-family="Georgia, serif" font-size="58" letter-spacing="5">ZUHR</text>
  <text x="400" y="790" text-anchor="middle" fill="#D0B477" font-family="sans-serif" font-size="19" letter-spacing="9">MARAHIL</text>
  <text x="400" y="838" text-anchor="middle" fill="#AEB5AA" font-family="sans-serif" font-size="17" letter-spacing="5">50 ML</text>
</svg>
